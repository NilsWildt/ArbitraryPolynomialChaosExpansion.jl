name: CI

on:
  push:
    branches:
      - main
      - dev/**
      - feature/**
    paths-ignore:
      - "data/**"
      - "examples/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "examples/**"

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12"   # minimum supported version (the [compat] floor)
          - "1"      # latest stable release
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Update registry
        run: julia -e 'using Pkg; Pkg.Registry.update()'
      - uses: julia-actions/julia-runtest@v1

  downgrade:
    # Validate that the package's [compat] lower bounds are real: resolve the
    # *lowest* allowed versions of the dependencies and confirm the package
    # still instantiates and loads. If this fails, raise the offending
    # dependency's lower bound in Project.toml.
    #
    # We intentionally load the package rather than run the full test suite at
    # the floor: Pkg.test pulls in the test-only AD stack (Mooncake, JET, ...),
    # whose tight inter-version coupling (e.g. Mooncake requiring a recent
    # DispatchDoctor) conflicts with downgrading the package's own deps and is
    # not what the package's compat bounds need to guarantee.
    name: Downgrade compat (Julia 1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"   # compat floor is 1.12; do not use 1.10
          arch: x64
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: LinearAlgebra, Random   # stdlibs in [compat], not downgradeable
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load package at downgraded versions
        run: julia --project=. -e 'using ArbitraryPolynomialChaosExpansion'

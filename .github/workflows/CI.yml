# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "notebooks/**"
      - "plots/**"
      - "examples/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "notebooks/**"
      - "plots/**"
      - "examples/**"

